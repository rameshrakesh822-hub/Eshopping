services:

  database:
    image: mysql:8.4
    container_name: college-database

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: college_management

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend

    container_name: college-backend

    restart: always

    env_file:
      - ./backend/.env

    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: college_management

    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./frontend

    container_name: college-frontend

    restart: always

    ports:
      - "80:80"

    depends_on:
      - backend

volumes:
  mysql_data: