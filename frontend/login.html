
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopZone | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">ShopZone</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="login.html">Login</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>

    <main class="form-container">
        <form id="login-form" class="form-box">
            <h2>Welcome Back!</h2>
            <p>Login to your ShopZone account</p>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>

            <button type="submit" class="btn full-btn">Login</button>

            <p id="login-message" class="message"></p>
        </form>
    </main>

    <footer>
        <p>© 2026 ShopZone. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
